name: CodePet CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codepet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify OpenCodex provenance
        run: npm run opencodex:verify

      - name: Verify packaged MIT notices
        run: npm run opencodex:package-notices

      - name: Verify parity baseline is current
        shell: bash
        run: |
          npm run opencodex:parity
          git diff --exit-code -- docs/opencodex-parity.json

      - name: Build embedded OpenCodex engine
        run: npm run opencodex:build-engine

      - name: Smoke test embedded OpenCodex engine
        run: npm run opencodex:engine-smoke

      - name: Run tests
        run: npm test

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: npm run dist -- --mac

      - name: Package Windows build
        if: runner.os == 'Windows'
        run: npm run dist -- --win

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codepet-${{ runner.os }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
